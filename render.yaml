services:
  - type: web
    name: infinity-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        # Replace this with your actual Vercel URL once deployed
        value: "https://your-vercel-app-url.vercel.app"
