services:
  - type: web
    name: infinity-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        # Actual Vercel URL
        value: "https://vidyavaibes.vercel.app"
