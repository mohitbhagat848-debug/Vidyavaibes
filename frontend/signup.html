<body class="flex flex-col min-h-screen">

    class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 flex justify-between items-center px-6 md:px-12 py-4">
    <a class="text-2xl font-black text-[#0B3D2E] tracking-tighter" href="index.html">AMEP</a>
    <a class="text-sm font-medium text-gray-600 hover:text-[#0B3D2E] transition-colors" href="index.html">Back to
      home</a>
  </header>
  <main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12">
    <!-- Signup Card Container -->
    <div
      class="w-full max-w-[480px] bg-white rounded-xl shadow-xl shadow-gray-200/50 p-8 md:p-10 border border-gray-50">
      <!-- Logo/Identity (Internal to Card) -->
      <div class="flex flex-col items-center mb-8 text-center">
        <div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-4 text-white">
          <span class="material-symbols-outlined text-3xl" data-icon="school">school</span>
        </div>
        <h1 class="text-2xl font-bold text-on-surface mb-2">Create Account</h1>
        <p class="text-sm text-on-surface-variant font-medium">Start your personalized learning journey</p>
      </div>
      <div id="signup-error"
        class="hidden bg-red-50 border border-red-200 text-red-700 text-sm font-medium px-4 py-3 rounded-lg"></div>
      <form class="space-y-5" id="signup-form" onsubmit="handleSignup(event)">
        <!-- Social Sign Up -->
        <button type="button" onclick="handleGoogleAuth()"
          class="w-full flex items-center justify-center gap-3 py-2.5 px-4 bg-white border border-outline-variant rounded-lg text-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors duration-150 active:scale-[0.98]">
          <img alt="Google Logo" class="w-5 h-5"
            data-alt="Official Google multi-colored G logo icon on a transparent background"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-wwHe70mY1zQHJkhSkplPSzJ1SDaKH5o7Wh7dastBmIKzFrft_hlZVGvUMfibnjxUm-WgNR3OvK1tTJdhSE0nXfYVlROd8kTgtyv1BDxKOdTj-pb3Z6EdR_9btcYUqxPzPmJamiwrn3fHdAvl1JVm3QNnmWD8nB2erGcCaXP4TuQMq4Xku2JGS0fecqm7dJ7l_dymGkz8x0uDSNDIWSaioV7k_RZuQTX3OdP5lCVcDoe6_wJIlTugjUHOaIanFPdSsPjZyMlKEy0d" />
          Continue with Google
        </button>
        <div class="relative py-2">
          <div aria-hidden="true" class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-outline-variant"></div>
          </div>
          <div class="relative flex justify-center text-xs font-medium">
            <span class="px-2 bg-white text-on-surface-variant">OR CONTINUE WITH EMAIL</span>
          </div>
        </div>
        <!-- Role Selection -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Join as a</label>
          <div class="grid grid-cols-3 gap-2 p-1 bg-surface-container-low rounded-lg">
            <label class="cursor-pointer">
              <input checked="" class="peer sr-only" name="role" type="radio" value="student" />
              <div
                class="flex items-center justify-center py-2 px-1 rounded-md text-xs font-semibold text-on-surface-variant peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-sm transition-all duration-200">
                Student
              </div>
            </label>
            <label class="cursor-pointer">
              <input class="peer sr-only" name="role" type="radio" value="teacher" />
              <div
                class="flex items-center justify-center py-2 px-1 rounded-md text-xs font-semibold text-on-surface-variant peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-sm transition-all duration-200">
                Teacher
              </div>
            </label>
            <label class="cursor-pointer">
              <input class="peer sr-only" name="role" type="radio" value="parent" />
              <div
                class="flex items-center justify-center py-2 px-1 rounded-md text-xs font-semibold text-on-surface-variant peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-sm transition-all duration-200">
                Parent
              </div>
            </label>
          </div>
        </div>
        <!-- Full Name -->
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-on-surface" for="name">Full Name</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-on-surface-variant">
              <span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
            </span>
            <input
              class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all"
              id="name" name="name" placeholder="John Doe" type="text" />
          </div>
        </div>
        <!-- Email -->
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-on-surface" for="email">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-on-surface-variant">
              <span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
            </span>
            <input
              class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all"
              id="email" name="email" placeholder="name@example.com" type="email" />
          </div>
        </div>
        <!-- Password -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="block text-sm font-semibold text-on-surface" for="password">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-on-surface-variant">
                <span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
              </span>
              <input
                class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all"
                id="password" name="password" placeholder="••••••••" type="password" />
            </div>
          </div>
          <div class="space-y-1.5">
            <label class="block text-sm font-semibold text-on-surface" for="confirm_password">Confirm Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-on-surface-variant">
                <span class="material-symbols-outlined text-[20px]" data-icon="lock_reset">lock_reset</span>
              </span>
              <input
                class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-sm placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all border-error/0"
                id="confirm_password" name="confirm_password" placeholder="••••••••" type="password" />

          </div>
        </div>
        <!-- Signup Button -->

          Sign Up
        </button>
      </form>
      <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <p class="text-sm text-on-surface-variant font-medium">
          Already have an account?
          <a class="text-[#0B3D2E] font-bold hover:underline" href="login.html">Login</a>
        </p>
      </div>
    </div>
  </main>
  <!-- Simple Footer for Auth Screen -->

      <div class="flex gap-6">
        <a class="text-xs text-gray-500 hover:text-primary-container transition-colors font-medium" href="#">Privacy
          Policy</a>
        <a class="text-xs text-gray-500 hover:text-primary-container transition-colors font-medium" href="#">Terms of

        <a class="text-xs text-gray-500 hover:text-primary-container transition-colors font-medium" href="#">Contact
          Support</a>
      </div>
    </div>
  </footer>
  <!-- Image for Visual Contrast (Background Decoration) -->
  <div class="fixed top-0 right-0 -z-10 opacity-10 pointer-events-none overflow-hidden">
    <img alt="Decorative learning patterns" class="w-[600px] h-[600px] object-contain"
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuA--eB6IfIiTdcIrPPi95fsO7ecp-8GTWg6PN3xZ1zxSxb_DwUSvZRo_cH6gLSLot7INYvGPirwqAzjtfW_wvKVlIXBp3oQmFVz_bnaNy406UJsTA6PJHDWxjCwryoPvggyeHecVZExxDY2nroVTmufslxqdRDvrlWHlqxvb4PZNe0H5r41N3xWlgOxm-nlpW26K5jBp5nEhEHqBVguFpLTrjBnIFwHADqLZo-H9jLGhdraaw-8Oa0ebRHFx7Y8UpGB3TJHYM36-wxh" />
  </div>

  <script>
    // ── Role-based redirect map ───────────────────────────────────────────────
    const ROLE_REDIRECT = {
      student: 'student_dashboard.html',
      teacher: 'teacher_dashboard.html',
      parent: 'parent_portal.html',
    };

    async function handleSignup(e) {
      e.preventDefault();

      const btn = document.getElementById('signup-btn');
      const errorBox = document.getElementById('signup-error');
      errorBox.classList.add('hidden');
      errorBox.textContent = '';

      // ── Read form values ────────────────────────────────────────────────────
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;
      const role = document.querySelector('input[name="role"]:checked')?.value || 'student';

      // ── Client-side validation ──────────────────────────────────────────────
      if (!name || !email || !password) {
        showError('Please fill in all required fields.');
        return;
      }
      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      // ── Call backend ────────────────────────────────────────────────────────
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch(`${window.AMEP_CONFIG.API_URL}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role }),
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Signup failed. Please try again.');
        }

        // ── Save token & user to localStorage ──────────────────────────────
        localStorage.removeItem('amep_python_progress');
        localStorage.removeItem('amep_python_synced');
        localStorage.removeItem('amep_analytics');
        localStorage.setItem('amep_token', data.token);
        localStorage.setItem('amep_user', JSON.stringify(data.user));

        // ── Redirect based on role ──────────────────────────────────────────
        const redirect = ROLE_REDIRECT[data.user.role] || 'student_dashboard.html';
        window.location.href = redirect;

      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    }

    async function handleGoogleAuth() {
      const email = prompt("Simulated Google Auth:\n\nEnter your Google Email (@gmail.com) to continue:");
      if (!email) return;

      if (!email.toLowerCase().includes('@gmail.com') && !email.toLowerCase().includes('google')) {
        showError('Please use a valid Google or Gmail address.');
        return;
      }

      const btn = document.getElementById('signup-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Authenticating...'; }
      document.getElementById('signup-error').classList.add('hidden');

      const role = document.querySelector('input[name="role"]:checked')?.value || 'student';

      try {
        const res = await fetch(`${window.AMEP_CONFIG.API_URL}/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, role })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || 'Google Auth failed.');

        localStorage.removeItem('amep_python_progress');
        localStorage.removeItem('amep_python_synced');
        localStorage.removeItem('amep_analytics');
        localStorage.setItem('amep_token', data.token);
        localStorage.setItem('amep_user', JSON.stringify(data.user));

        // Go to onboarding for new students, else home
        const redirect = ROLE_REDIRECT[data.user.role] || 'student_dashboard.html';
        window.location.href = redirect;
      } catch (err) {
        showError(err.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Sign Up'; }
      }
    }

    function showError(msg) {
      const box = document.getElementById('signup-error');
      box.textContent = '⚠️  ' + msg;
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
</body>
