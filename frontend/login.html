<body class="bg-background text-on-background min-h-screen flex flex-col font-body">
  <!-- TopNavBar (Shared Component Execution) -->
  <nav
    class="bg-white/80 dark:bg-emerald-950/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-gray-100 dark:border-emerald-900/50 shadow-sm">
    <div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto font-inter antialiased">
      <a class="text-2xl font-black tracking-tighter text-emerald-900 dark:text-emerald-50" href="index.html">
        AMEP
      </a>

      <div class="flex items-center gap-4">
        <a class="text-emerald-900 dark:text-emerald-50 font-medium hover:text-emerald-700 transition-colors transition-all active:scale-95 duration-200"
          href="signup.html">Sign Up</a>
        <a class="bg-primary-container text-on-primary-container px-6 py-2.5 rounded-full font-semibold hover:bg-primary transition-all active:scale-95 duration-200 text-center"
          href="signup.html">
          Get Started
        </a>
      </div>
    </div>
  </nav>
  <!-- Main Content Area -->
  <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4 relative">
    <!-- Background texture overlay -->
    <div class="bg-textured"></div>
    <div class="w-full max-w-[480px] bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] overflow-hidden">
      <div class="p-8 md:p-12">
        <!-- Header -->
        <div class="text-center mb-10">
          <h1 class="text-3xl font-extrabold text-on-surface tracking-tight mb-2">Welcome Back</h1>
          <p class="text-on-surface-variant font-medium">Login to continue your personalized learning</p>
        </div>
        <!-- Social Login -->
        <button type="button" onclick="handleGoogleAuth()"
          class="w-full flex items-center justify-center gap-3 px-6 py-3.5 border border-outline-variant rounded-xl hover:bg-surface-container-low transition-all active:scale-[0.98] duration-200 mb-8">
          <img alt="Google Logo" class="w-5 h-5"
            data-alt="Google company logo with multi-colored brand emblem on a transparent background"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDM2rS_HTsTtG7UPjee0JBSXa0ChpOQDcbCtAI4A0smOG2BszU-UM0nshAl_FhPaS2k-inXbzZEqqBAg4mBIrYveobTuUxO9YGS2_lhhO_78rG1eH8_NJWLIu-Q7Uk7Y7WjYejkHmbZ3GH6SrRsF_oPfNtikv2x6emJRu6-0ccqjur0HXMIZJNZPJb8xz4H2bnV7N0LjyPWYu8HhGoHGDiDwQGzzWKkHMxdmHKG6_5rDhlPJZ9Y-i3Kp4Q6CHW5CpCJcJD8kD8T8w29" />
          <span class="font-semibold text-on-surface">Continue with Google</span>
        </button>
        <div class="relative mb-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-outline-variant"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-on-surface-variant font-medium">Or login with email</span>
          </div>
        </div>
        <!-- Login Form -->
        <div id="login-error"
          class="hidden bg-red-50 border border-red-200 text-red-700 text-sm font-medium px-4 py-3 rounded-lg mb-4">
        </div>
        <form action="#" class="space-y-6" id="login-form" onsubmit="handleLogin(event)">
          <div>
            <label class="block text-sm font-bold text-on-surface mb-2" for="email">Email</label>
            <div class="relative group">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary-fixed-dim transition-colors">mail</span>
              <input
                class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-transparent rounded-xl focus:border-secondary-fixed-dim focus:ring-4 focus:ring-secondary-container/20 outline-none transition-all placeholder:text-outline/60 text-on-surface"
                id="email" placeholder="name@company.com" required="" type="email" />
            </div>
          </div>
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-sm font-bold text-on-surface" for="password">Password</label>
              <a class="text-sm font-semibold text-on-secondary-fixed-variant hover:text-secondary-fixed-dim transition-colors"
                href="#">Forgot password?</a>
            </div>
            <div class="relative group">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary-fixed-dim transition-colors">lock</span>
              <input
                class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-transparent rounded-xl focus:border-secondary-fixed-dim focus:ring-4 focus:ring-secondary-container/20 outline-none transition-all placeholder:text-outline/60 text-on-surface"
                id="password" placeholder="••••••••" required="" type="password" />
            </div>
          </div>
          <div class="flex items-center">
            <input
              class="w-5 h-5 rounded border-outline-variant text-secondary-fixed-dim focus:ring-secondary-container focus:ring-offset-0 transition-all cursor-pointer"
              id="remember" type="checkbox" />
            <label class="ml-3 text-sm font-medium text-on-surface-variant cursor-pointer select-none"
              for="remember">Remember me for 30 days</label>
          </div>
          <button id="login-btn" type="submit"
            class="w-full bg-secondary-container text-on-secondary-container font-extrabold py-4 rounded-xl shadow-lg shadow-secondary-container/20 hover:bg-secondary-fixed hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 text-center block">
            Login
          </button>
        </form>
        <!-- Footer Text -->
        <p class="text-center mt-8 text-on-surface-variant font-medium">
          Don't have an account?
          <a class="text-secondary-fixed-dim font-bold hover:underline transition-all" href="signup.html">Sign up</a>
        </p>
      </div>
    </div>
  </main>
  <!-- Footer (Shared Component Execution) -->
  <footer class="bg-gray-50 dark:bg-emerald-950 w-full py-12 border-t border-gray-200 dark:border-emerald-900">
    <div
      class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto text-sm font-inter text-emerald-900 dark:text-emerald-50">

        <span class="text-lg font-bold text-emerald-900 dark:text-emerald-50">AMEP</span>
        <p class="mt-2 text-gray-400 dark:text-emerald-500">© 2024 AMEP AI Education. All rights reserved.</p>
      </div>
      <div class="flex flex-wrap justify-center gap-6">
        <a class="text-gray-400 dark:text-emerald-500 hover:underline hover:text-emerald-600 transition-all"
          href="#">Privacy Policy</a>
        <a class="text-gray-400 dark:text-emerald-500 hover:underline hover:text-emerald-600 transition-all"
          href="#">Terms of Service</a>
        <a class="text-gray-400 dark:text-emerald-500 hover:underline hover:text-emerald-600 transition-all"
          href="#">Help Center</a>
        <a class="text-gray-400 dark:text-emerald-500 hover:underline hover:text-emerald-600 transition-all"
          href="#">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    // ── Role-based redirect map ───────────────────────────────────────────────
    const ROLE_REDIRECT = {
      student: 'student_dashboard.html',
      teacher: 'teacher_dashboard.html',
      parent: 'parent_portal.html',
    };

    async function handleLogin(e) {
      e.preventDefault();

      const btn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');
      errorBox.classList.add('hidden');
      errorBox.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await fetch(`${window.AMEP_CONFIG.API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }

        // ── Save token & user to localStorage ──────────────────────────────
        localStorage.removeItem('amep_python_progress');
        localStorage.removeItem('amep_python_synced');
        localStorage.removeItem('amep_analytics');
        localStorage.setItem('amep_token', data.token);
        localStorage.setItem('amep_user', JSON.stringify(data.user));

        // ── Redirect based on role ──────────────────────────────────────────
        const redirect = ROLE_REDIRECT[data.user.role] || 'student_dashboard.html';
        window.location.href = redirect;

      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    async function handleGoogleAuth() {
      const email = prompt("Simulated Google Auth:\n\nEnter your Google Email (@gmail.com) to continue:");
      if (!email) return;

      if (!email.toLowerCase().includes('@gmail.com') && !email.toLowerCase().includes('google')) {
        showError('Please use a valid Google or Gmail address.');
        return;
      }

      const btn = document.getElementById('login-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Authenticating...'; }
      document.getElementById('login-error').classList.add('hidden');

      try {
        const res = await fetch(`${window.AMEP_CONFIG.API_URL}/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || 'Google Auth failed.');

        localStorage.removeItem('amep_python_progress');
        localStorage.removeItem('amep_python_synced');
        localStorage.removeItem('amep_analytics');
        localStorage.setItem('amep_token', data.token);
        localStorage.setItem('amep_user', JSON.stringify(data.user));

        const redirect = ROLE_REDIRECT[data.user.role] || 'student_dashboard.html';
        window.location.href = redirect;
      } catch (err) {
        showError(err.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Login'; }
      }
    }

    function showError(msg) {
      const box = document.getElementById('login-error');
      box.textContent = '⚠️  ' + msg;
      box.classList.remove('hidden');
    }
  </script>
</body>

</html>
